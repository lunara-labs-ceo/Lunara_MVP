# Render Blueprint
# https://render.com/docs/blueprint-spec

services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: lunara-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RENDER
        value: "true"
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: AGENT_ENGINE_RESOURCE_NAME
        sync: false
      - key: CLERK_ISSUER_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /health

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  - type: web
    name: lunara-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install -g pnpm && pnpm install && pnpm build
    startCommand: cd frontend && pnpm start
    envVars:
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
