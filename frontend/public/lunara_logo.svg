<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&amp;display=swap');
    </style>
  </defs>
  
  <!-- Icon Group -->
  <g transform="translate(10, 0)">
     <!-- Connections -->
     <g stroke="#0033FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Outer Spine Path -->
        <polyline points="65,15 38,25 22,50 38,75 65,85" fill="none"/>
        
        <!-- Inner zigzag connections -->
        <line x1="65" y1="15" x2="52" y2="35" />
        <line x1="52" y1="35" x2="38" y2="25" />
        
        <line x1="38" y1="25" x2="42" y2="50" />
        <line x1="52" y1="35" x2="42" y2="50" />
        
        <line x1="22" y1="50" x2="42" y2="50" />
        
        <line x1="42" y1="50" x2="52" y2="65" />
        <line x1="42" y1="50" x2="38" y2="75" />
        
        <line x1="52" y1="65" x2="38" y2="75" />
        <line x1="52" y1="65" x2="65" y2="85" />
     </g>
     
     <!-- Nodes -->
     <g fill="#0033FF">
        <!-- Outer nodes -->
        <circle cx="65" cy="15" r="4.5" />
        <circle cx="38" cy="25" r="4.5" />
        <circle cx="22" cy="50" r="4.5" />
        <circle cx="38" cy="75" r="4.5" />
        <circle cx="65" cy="85" r="4.5" />
        
        <!-- Inner nodes -->
        <circle cx="52" cy="35" r="4" />
        <circle cx="42" cy="50" r="4" />
        <circle cx="52" cy="65" r="4" />
     </g>
  </g>
  
  <!-- Text -->
  <text x="110" y="66" font-family="'Inter', Helvetica, Arial, sans-serif" font-weight="600" font-size="52" letter-spacing="2" fill="#1A1A1A">LUNARA</text>
</svg>
